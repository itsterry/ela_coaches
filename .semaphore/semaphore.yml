version: v1.0

name: Standard Pipeline

agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2604

blocks:
  - name: Rspec & RuboCop
    task:
      secrets:
        - name: ela-coaches-env
      prologue:
        commands:
          - checkout
          - cache restore
          - sem-version ruby 4.0.6
          - sem-service start mysql 8.0
          - bundle config set --local deployment 'true'
          - bundle install
          - bundle exec rake db:setup
          - bundle exec rails assets:precompile

      epilogue:
        commands:
          - cache store

      jobs:
        - name: RSpec & RuboCop
          commands:
            - bundle exec rspec spec
            - bundle exec rubocop

auto_cancel:
  running:
    when: 'true'

promotions:
  - name: Production deploy
    pipeline_file: production_deploy.yml
    auto_promote_on:
      - result: passed
        branch:
          - ^master$

  - name: Staging deploy
    pipeline_file: staging_deploy.yml
    auto_promote_on:
      - result: passed
        branch:
          - ^staging$
