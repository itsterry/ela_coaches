<% require "dotenv"; Dotenv.load(".env") %>

# Name of your application. Used to uniquely configure containers.
service: elacoaches

# Name of the container image.
image: itsterry/elacoaches

# Deploy to these servers.
servers:
  web:
    - 204.168.227.211
  job:
    hosts:
      - 204.168.227.211
    cmd: bin/jobs

# Kamal Proxy terminates SSL via Let's Encrypt for both hostnames.
proxy:
  ssl: true
  hosts:
    - elacoaches.com
    - www.elacoaches.com

# Where you keep your container images.
registry:
  username: itsterry

  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - ELA_COACHES_DATABASE_PASSWORD
  clear:
    # Jobs run in their own container via bin/jobs, so keep the Solid Queue
    # supervisor out of the web server's Puma process.
    SOLID_QUEUE_IN_PUMA: false

    # Two cores on this host.
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5

    # The db accessory on the same machine, over the local kamal docker network.
    DB_HOST: elacoaches-db

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  after_party: app exec -- "bundle exec rake after_party:run"
  console: app exec --interactive --reuse "bin/rails console"
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"

# Use a persistent storage volume for local Active Storage files.
volumes:
  - "elacoaches_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch:
    - amd64
  cache:
    type: registry
    options: mode=max

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: mysql:8.0
    host: 204.168.227.211
    # Bound to loopback so the database is reachable only over an SSH tunnel,
    # not from the internet. The app reaches it by name on the kamal network.
    port: "127.0.0.1:3306:3306"
    env:
      clear:
        MYSQL_ROOT_HOST: '%'
      secret:
        - MYSQL_ROOT_PASSWORD
    files:
      - db/setup.sql:/docker-entrypoint-initdb.d/setup.sql
      - db/tuning.cnf:/etc/mysql/conf.d/zz-tuning.cnf
    directories:
      - data:/var/lib/mysql
